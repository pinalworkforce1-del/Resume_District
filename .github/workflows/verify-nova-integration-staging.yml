name: Verify Resume District Nova Integration (Staging)
on:
  push:
    branches:
      - nova-resume-integration-staging-20261112
    paths:
      - src/ResumeDistrict.tsx
      - tests/verify-nova-staging.cjs
      - .github/workflows/verify-nova-integration-staging.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/verify-nova-staging.cjs
