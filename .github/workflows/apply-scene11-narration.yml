name: Apply Scene 11 narration asset

on:
  push:
    branches: [main]
    paths:
      - '.scene11-upload/READY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode replacement narration
        shell: bash
        run: |
          set -euo pipefail
          test -f .scene11-upload/READY || exit 0
          cat .scene11-upload/part-*.b64 | tr -d '\n\r' | base64 --decode > public/assets/resume/scenes/narration-11.mp4
          rm -rf .scene11-upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/resume/scenes/narration-11.mp4 .scene11-upload
          git commit -m "Replace Scene 11 narration and captions"
          git push
